name: Silent Code (self-check)

# Dogfooding: this repo enforces its own zero-comments / zero-coauthor /
# zero-ai-attribution policies on every PR, using its own freshly built CLI
# rather than a published npm package.

on:
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check diff and commit messages
        run: node dist/cli.mjs check --range ${{ github.event.pull_request.base.sha }}..${{ github.sha }}

      - name: Check PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr-message.txt
          node dist/cli.mjs check-message /tmp/pr-message.txt
